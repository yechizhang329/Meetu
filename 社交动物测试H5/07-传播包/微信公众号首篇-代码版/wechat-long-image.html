<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=750,initial-scale=1" />
  <title>公众号首篇 · 正文长图 · 渲染源</title>
  <style>
    @font-face {
      font-family: "PingFang SC";
      src: local("PingFang SC"), local("Noto Sans SC"), local("Microsoft YaHei");
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #ece5d4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: #1f1f1f;
    }
    .canvas {
      width: 750px;
      margin: 0 auto;
      padding: 36px 44px 40px;
      background: #fff8e8;
      box-sizing: border-box;
    }
    .top-tag {
      font-size: 18px;
      letter-spacing: 0.42em;
      color: #a0958a;
      font-weight: 900;
      margin: 0 0 12px;
    }
    h1.title {
      margin: 0 0 18px;
      font-size: 60px;
      line-height: 1.06;
      letter-spacing: -2.5px;
      font-weight: 950;
      color: #1f1f1f;
    }
    .meta {
      margin: 0 0 20px;
      padding: 18px 22px;
      background: #fffdf5;
      border: 4px dashed #1f1f1f;
      border-radius: 22px;
    }
    .meta p {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.5;
      font-weight: 800;
      color: #1f1f1f;
    }
    .stamp {
      display: inline-block;
      padding: 7px 18px;
      background: #ff5a3d;
      color: #fff8ea;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.06em;
      box-shadow: 4px 4px 0 rgba(31,31,31,0.32);
      transform: rotate(-2deg);
    }
    .hook-pill {
      display: inline-block;
      margin: 0 0 28px;
      padding: 16px 28px;
      background: #ffe15a;
      border: 4px solid #1f1f1f;
      border-radius: 20px;
      font-size: 38px;
      font-weight: 950;
      letter-spacing: -0.8px;
      color: #1f1f1f;
      box-shadow: 7px 7px 0 rgba(31,31,31,0.24);
    }
    .hook-wrap { text-align: center; }
    .result-img-wrap { text-align: center; margin: 4px 0 8px; }
    .result-img-wrap img {
      display: inline-block;
      width: 600px;
      height: auto;
      border: 4px solid #1f1f1f;
      border-radius: 24px;
      box-shadow: 10px 10px 0 rgba(31,31,31,0.18);
    }
    .caption {
      text-align: center;
      font-size: 20px;
      line-height: 1.5;
      color: #70685e;
      font-weight: 800;
      margin: 14px 0 28px;
    }
    .lead {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.5;
      font-weight: 900;
      color: #1f1f1f;
    }
    .lead-small {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.5;
      color: #a0958a;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    blockquote.quote {
      margin: 0 0 12px;
      padding: 14px 20px;
      background: #fffdf5;
      border-left: 7px solid #ff7a3d;
      border-radius: 0 14px 14px 0;
      font-size: 24px;
      line-height: 1.4;
      font-weight: 900;
      color: #1f1f1f;
    }
    .cta-q {
      margin: 30px 0 4px;
      font-size: 44px;
      line-height: 1.16;
      font-weight: 950;
      letter-spacing: -1.2px;
      color: #1f1f1f;
    }
    .cta-line {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.4;
      font-weight: 900;
      color: #1f1f1f;
    }
    .footer {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 2px solid rgba(31,31,31,0.18);
      font-size: 14px;
      color: #a0958a;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="canvas" id="poster">
  <p class="top-tag">今 日 挂 牌</p>
  <h1 class="title">今日动物园挂牌：你。</h1>

  <div class="meta">
    <p>品种：未知<br />习性：可疑</p>
    <span class="stamp">朋友锐评：已生成</span>
  </div>

  <div class="hook-wrap">
    <span class="hook-pill">别当熟人面点开。</span>
  </div>

  <div class="result-img-wrap">
    <img src="../微信公众号首篇-弹幕羊驼结果图.png" alt="弹幕羊驼·分享卡示例" />
  </div>
  <p class="caption">先别笑，下一张可能是你。</p>

  <p class="lead">它不像测试，</p>
  <p class="lead">像群友提前写好的说明牌。</p>

  <p class="lead-small">可能会写——</p>

  <blockquote class="quote">你不是失踪，<br />你只是进入了省电模式。</blockquote>
  <blockquote class="quote">你不是鸽，<br />你只是出门启动失败。</blockquote>
  <blockquote class="quote">表面风平浪静，<br />内心已经开了八个直播间。</blockquote>

  <p class="cta-q">不服？</p>
  <p class="cta-line">点下方「阅读原文」，<br />把自己挂上去。</p>

  <p class="footer">Meetu · 社交动物测试</p>
</div>

</body>
</html>
