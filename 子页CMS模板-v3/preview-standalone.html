// Tab switching logic
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    const template = this.getAttribute('data-template');

    // Update active button
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');

    // Update active template
    document.querySelectorAll('.template-section').forEach(s => s.classList.remove('active'));
    document.getElementById('tpl-' + template).classList.add('active');

    // Load template content if not already loaded
    if (!document.getElementById('tpl-' + template).innerHTML) {
      document.getElementById('tpl-' + template).innerHTML = templates[template];
    }

    // Scroll to top
    document.querySelector('.phone-screen').scrollTop = 0;
  });
});

// Load template A on page load
