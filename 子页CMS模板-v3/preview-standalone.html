<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetu 觅遇社 CMS模板 v3.2 Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(circle at top, #1d1a1f 0%, #0f0f12 70%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}
.header { text-align: center; padding: 48px 24px 30px; }
.header h1 {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #ff7422, #ffcf92);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header p { color: rgba(255,255,255,0.48); font-size: 14px; }
.nav {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 24px 34px;
  flex-wrap: wrap;
}
.nav button {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.72);
  cursor: pointer;
  font-size: 14px;
  transition: all .18s ease;
}
.nav button.active,
.nav button:hover {
  background: rgba(255,116,34,0.15);
  border-color: rgba(255,116,34,0.28);
  color: #ffad77;
}
.preview-wrap { display: flex; justify-content: center; padding: 0 24px 70px; }
.frame {
  width: 394px;
  padding: 16px;
  border-radius: 44px;
  background: #19181c;
  box-shadow: 0 40px 90px rgba(0,0,0,0.45), 0 0 0 2px rgba(255,255,255,0.05);
}
.notch {
  width: 132px;
  height: 6px;
  border-radius: 999px;
  margin: 0 auto 12px;
  background: #121216;
}
.screen {
  background: #fff;
  border-radius: 32px;
  overflow: hidden;
  height: 80vh;
}
.screen iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}
.meta {
  text-align: center;
  padding: 0 24px 42px;
}
.meta .tag {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.44);
  font-size: 12px;
  margin-bottom: 12px;
}
.meta .name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.meta .desc {
  font-size: 13px;
  color: rgba(255,255,255,0.38);
}
</style>
</head>
<body>

<div class="header">
  <h1>Meetu CMS v3.2</h1>
  <p>真实素材重构版 · 更强标题层级 · 更接近内容页完成度</p>
</div>

<div class="nav">
  <button class="active" data-src="A-campaign-pop-主理人招募.html">A · 主理人招募</button>
  <button data-src="B-youth-editorial-平台介绍.html">B · 平台介绍</button>
  <button data-src="C-soft-tech-活动收费说明.html">C · 活动收费</button>
  <button data-src="D-festival-topic-女生专场.html">D · 女生专场</button>
</div>

<div class="preview-wrap">
  <div class="frame">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="preview-frame" src="A-campaign-pop-主理人招募.html" title="CMS template preview"></iframe>
    </div>
  </div>
</div>

<div class="meta">
  <div class="tag">v3.2 · 2026-04-04</div>
  <div class="name">觅遇社 Meetu</div>
  <div class="desc">Nice to Meetu · 内容页完成度重构版</div>
</div>

<script>
const frame = document.getElementById('preview-frame');
document.querySelectorAll('.nav button').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach((b) => b.classList.remove('active'));
    button.classList.add('active');
    frame.src = button.dataset.src;
  });
});
</script>

</body>
</html>
