<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Demo 2 - 校园英语角</title>
</head>
<body style="margin:0;background:#f4efe7">
<div style='width:100%;max-width:750px;margin:0 auto;overflow:hidden;background:
radial-gradient(circle at 12% 10%,rgba(217,122,83,0.14),transparent 18%),
radial-gradient(circle at 84% 14%,rgba(87,107,98,0.16),transparent 18%),
linear-gradient(180deg,#f4f1eb 0%,#f8f4ec 48%,#f1ede4 100%);
color:#253036;font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;'>

  <section style="padding:24px 20px 24px;border-bottom:1px solid rgba(37,48,54,0.08)">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div style="display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(87,107,98,0.08);font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:11px;font-weight:700;letter-spacing:1.1px;color:#576b62">EDITORIAL CAMPUS</div>
      <div style="display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(217,122,83,0.12);font-size:11px;font-weight:700;color:#9d5637">8-12人｜¥15/人</div>
    </div>
    <div style="margin-top:18px;max-width:33em">
      <div style='font-family:"Songti SC","STSong","PingFang SC","Microsoft YaHei",serif;font-size:40px;line-height:1.04;font-weight:700;letter-spacing:-1px;'>用英语聊点没用的，<br/>反而最容易开口。</div>
      <p style="margin:16px 0 0;font-size:15px;line-height:1.9;color:rgba(37,48,54,0.7)">TODO：替换为 Lucy 最终版导语，方向是“轻松有价值感，不像上课，像会说话的人把你拉进来聊天”。</p>
    </div>
  </section>

  <section style="padding:18px 20px 14px">
    <div style="display:flex;flex-wrap:wrap;gap:12px">
      <div style="flex:1 1 100%;min-width:0;padding:18px;border-radius:28px;background:#fffdf8;box-shadow:0 16px 34px rgba(69,58,45,0.08);border:1px solid rgba(87,107,98,0.08)">
        <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#576b62">HOST NOTE</div>
        <div style="margin-top:10px;font-size:21px;font-weight:800;line-height:1.25">雅思 8 分，但不想当老师。就想找人练嘴。</div>
        <p style="margin:10px 0 0;font-size:14px;line-height:1.85;color:rgba(37,48,54,0.66)">TODO：替换为 Lucy 最终版主理人介绍。</p>
      </div>
      <div style="flex:1 1 48%;min-width:0;padding:18px;border-radius:26px;background:#ffffff;border:1px solid rgba(37,48,54,0.08);box-shadow:0 14px 28px rgba(37,48,54,0.06)">
        <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#576b62">TOPICS</div>
        <p style="margin:12px 0 0;font-size:14px;line-height:1.85;color:rgba(37,48,54,0.68)">TODO：替换为主题 / 话题预告。</p>
      </div>
      <div style="flex:1 1 48%;min-width:0;padding:18px;border-radius:26px;background:#253036;color:#f7f5ef;box-shadow:0 14px 28px rgba(37,48,54,0.14)">
        <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#c9d7d0">WHO IT'S FOR</div>
        <p style="margin:12px 0 0;font-size:14px;line-height:1.85;color:rgba(247,245,239,0.76)">TODO：替换为适合谁 / 零基础友好等说明。</p>
      </div>
    </div>
  </section>

  <section style="padding:0 20px 14px">
    <div style="padding:20px;border-radius:28px;background:linear-gradient(135deg,#fefaf2 0%,#f5efe6 100%);border:1px solid rgba(87,107,98,0.08)">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(87,107,98,0.1);font-size:12px;color:#4e6259">轻松开口</span>
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(217,122,83,0.12);font-size:12px;color:#9d5637">不做作业</span>
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(87,107,98,0.1);font-size:12px;color:#4e6259">有饮品</span>
      </div>
      <div style="font-size:20px;font-weight:800;line-height:1.2;color:#253036">来了就能开口，不用先做心理建设。</div>
      <p style="margin:10px 0 0;font-size:14px;line-height:1.85;color:rgba(37,48,54,0.68)">TODO：替换为 Lucy 最终版参与须知 / 低门槛说明。</p>
