<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Demo 3 - 周末 City Walk</title>

<body style="margin:0;background:#f3ede3">
<div style='width:100%;max-width:750px;margin:0 auto;overflow:hidden;background:
radial-gradient(circle at 18% 8%,rgba(255,184,119,0.18),transparent 18%),
radial-gradient(circle at 84% 18%,rgba(118,146,188,0.18),transparent 18%),
linear-gradient(180deg,#faf6ef 0%,#f3ede3 52%,#efe7db 100%);
color:#332419;font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;'>

  <section style="padding:24px 20px 24px;border-bottom:1px solid rgba(51,36,25,0.08)">

      <div style="display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,0.7);font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:11px;font-weight:700;letter-spacing:1.1px;color:#865f42">WEEKEND WALK</div>
      <div style="display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,184,119,0.18);font-size:11px;font-weight:700;color:#9a6137">3-6人｜¥0.01 门槛价</div>
    </div>
    <div style="margin-top:18px;max-width:34em">
      <div style='font-family:"Songti SC","STSong","PingFang SC","Microsoft YaHei",serif;font-size:38px;line-height:1.06;font-weight:700;letter-spacing:-0.8px;'>绕老城区一圈，<br/>顺便找家好喝的咖啡。</div>
      <p style="margin:16px 0 0;font-size:15px;line-height:1.9;color:rgba(51,36,25,0.68)">TODO：替换为 Lucy 最终版生活方式导语，方向是轻松、生活感、像朋友圈邀请而不是活动通知。</p>
    </div>
  </section>

  <section style="padding:18px 20px 14px">
    <div style="padding:18px;border-radius:28px;background:#fffdf8;box-shadow:0 16px 34px rgba(118,93,61,0.08);border:1px solid rgba(118,93,61,0.08)">
      <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#8e6949">HOST NOTE</div>
      <div style="margin-top:10px;font-size:21px;font-weight:800;line-height:1.28;color:#332419">上周走了 8 公里，发现了一家巷子里的手冲，老板是个退休程序员。</div>
      <p style="margin:10px 0 0;font-size:14px;line-height:1.85;color:rgba(51,36,25,0.66)">TODO：替换为 Lucy 最终版主理人一句话。</p>
    </div>
  </section>

  <section style="padding:0 20px 14px">
    <div style="display:flex;flex-wrap:wrap;gap:12px">
      <div style="flex:1 1 48%;min-width:0;padding:18px;border-radius:26px;background:#fff;box-shadow:0 14px 30px rgba(99,83,61,0.08)">
        <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#8e6949">ROUTE</div>
        <p style="margin:12px 0 0;font-size:14px;line-height:1.85;color:rgba(51,36,25,0.68)">TODO：替换为路线 / 时间 / 集合点。</p>

        <div style="font-family:ui-monospace,'SFMono-Regular','SF Mono','Menlo','Monaco',monospace;font-size:10px;letter-spacing:1.1px;color:#d9ebff">ENTRY</div>
        <p style="margin:12px 0 0;font-size:14px;line-height:1.85;color:rgba(248,247,243,0.8)">TODO：替换为参与门槛，例如“舒服的鞋就行”。</p>
      </div>
    </div>

  <section style="padding:0 20px 28px">
    <div style="padding:20px 18px;border-radius:28px;background:linear-gradient(135deg,#ffcb93 0%,#ffdca8 52%,#f5efe3 100%);color:#332419;box-shadow:0 20px 44px rgba(160,112,53,0.12)">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.68);font-size:12px;color:#865f42">轻松走走</span>
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.68);font-size:12px;color:#865f42">实际 AA</span>
        <span style="display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.68);font-size:12px;color:#865f42">门槛价确认</span>
      </div>
      <div style="font-size:28px;line-height:1.02;font-weight:900;letter-spacing:-1px">别想太多，先走出来再说。</div>
      <p style="margin:10px 0 0;font-size:14px;line-height:1.8;color:rgba(51,36,25,0.7)">TODO：替换为 Lucy 最终版 CTA / 收尾短文案。</p>
