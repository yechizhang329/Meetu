<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1100" fill="#F4EFE8"/>
  <rect x="56" y="56" width="1488" height="988" rx="36" fill="#FCF8F2" stroke="#E6DED2" stroke-width="2"/>

  <text x="110" y="138" fill="#121317" font-family="PingFang SC, Inter, sans-serif" font-size="44" font-weight="700">Meetu Logo Concept D1 v1</text>
  <text x="110" y="178" fill="#6B6257" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="500">M 主 icon + Meetu 定制字标 / 小程序 icon、海报角标、封面水印示意</text>

  <rect x="110" y="240" width="410" height="640" rx="34" fill="#121317"/>
  <text x="144" y="302" fill="#F6F0E8" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700">App Icon / 主符号</text>
  <text x="144" y="334" fill="#AFA59A" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="500">目标：64×64 仍能识别，自信、简洁、有号召力</text>

  <rect x="190" y="392" width="250" height="250" rx="56" fill="#181A20"/>
  <rect x="226" y="448" width="44" height="128" rx="22" fill="#F6F0E8"/>
  <rect x="360" y="448" width="44" height="128" rx="22" fill="#F6F0E8"/>
  <path d="M270 572L316 448H344L390 572H350L330 510L310 572H270Z" fill="#F6F0E8"/>
  <rect x="304" y="508" width="24" height="18" rx="9" fill="#FF7422"/>

  <text x="210" y="698" fill="#F6F0E8" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="600">关键词</text>
  <text x="210" y="734" fill="#CFC4B6" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="500">有趣 / 自由 / 酷 / 有态度</text>
  <text x="210" y="768" fill="#CFC4B6" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="500">不是陪伴感，而是召集感</text>

  <rect x="580" y="240" width="910" height="280" rx="34" fill="#FFF9F1" stroke="#E7DED2" stroke-width="2"/>
  <text x="620" y="302" fill="#121317" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700">Poster Lockup / 海报角标</text>
  <text x="620" y="334" fill="#6B6257" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="500">icon + wordmark 组合，用于海报、banner、活动页角标</text>

  <rect x="640" y="380" width="84" height="84" rx="22" fill="#121317"/>
  <rect x="657" y="402" width="15" height="42" rx="7.5" fill="#F6F0E8"/>
  <rect x="692" y="402" width="15" height="42" rx="7.5" fill="#F6F0E8"/>
  <path d="M672 444L686 402H694L708 444H696L690 423L684 444H672Z" fill="#F6F0E8"/>
  <rect x="685" y="421" width="8" height="7" rx="3.5" fill="#FF7422"/>

  <text x="756" y="442" fill="#121317" font-family="Avenir Next, PingFang SC, Inter, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Meetu</text>
  <text x="760" y="475" fill="#786E63" font-family="PingFang SC, Inter, sans-serif" font-size="18" font-weight="500">会玩的年轻平台 / 自信且有号召力</text>

  <rect x="580" y="580" width="910" height="300" rx="34" fill="#161920"/>
  <text x="620" y="642" fill="#F6F0E8" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="700">Cover Watermark / 封面水印</text>
  <text x="620" y="674" fill="#B9B0A6" font-family="PingFang SC, Inter, sans-serif" font-size="16" font-weight="500">单独使用 icon，压在封面或活动图上，保持记忆点但不打扰主画面</text>

  <rect x="1120" y="658" width="180" height="180" rx="40" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.1"/>
  <rect x="1160" y="704" width="24" height="88" rx="12" fill="#F6F0E8" fill-opacity="0.75"/>
  <rect x="1236" y="704" width="24" height="88" rx="12" fill="#F6F0E8" fill-opacity="0.75"/>
  <path d="M1184 792L1210 704H1222L1248 792H1226L1216 754L1206 792H1184Z" fill="#F6F0E8" fill-opacity="0.75"/>
  <rect x="1207" y="751" width="12" height="10" rx="5" fill="#FF7422"/>

  <text x="620" y="760" fill="#F6F0E8" font-family="PingFang SC, Inter, sans-serif" font-size="46" font-weight="700">好玩的事在发生</text>
  <text x="620" y="812" fill="#D8D0C6" font-family="PingFang SC, Inter, sans-serif" font-size="24" font-weight="500">这里不是“陪伴型图标”，而是“有事发生型符号”</text>
  <text x="620" y="846" fill="#9E958A" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="500">橙色只做焦点，不再把“温暖”当第一语言</text>

  <rect x="110" y="918" width="1380" height="76" rx="20" fill="#FFF4E8" stroke="#ECD8C8" stroke-width="2"/>
  <text x="144" y="964" fill="#4B4138" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="600">说明：这是方向稿，不是最终定稿。当前优先验证的是 icon 气质、缩小识别、角标传播感，而不是字标最后的精修细节。</text>
</svg>
