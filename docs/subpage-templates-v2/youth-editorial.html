<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Youth Editorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans SC", sans-serif;
      color: #34281d;
      background: linear-gradient(180deg, #fff6ea 0%, #f9efe6 100%);
    }
    .shell { width: min(calc(100% - 28px), 420px); margin: 0 auto; padding: 18px 0 34px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .chip, .link { border-radius: 999px; font-size: 12px; font-weight: 700; }
    .chip { padding: 8px 12px; background: rgba(84, 56, 26, .08); }
    .link { padding: 10px 14px; background: #fff; border: 1px solid rgba(84, 56, 26, .1); text-decoration: none; color: inherit; }
    .hero, .panel {
      margin-top: 16px;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255,255,255,.56);
      border: 1px solid rgba(84, 56, 26, .08);
      box-shadow: 0 22px 50px rgba(104, 72, 45, .10);
      backdrop-filter: blur(14px);
    }
    .hero h1, .panel h2, .quote {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: -0.03em;
    }
    .hero h1 { margin: 14px 0 10px; font-size: 60px; line-height: .86; }
    .hero p, .panel p { margin: 0; line-height: 1.9; font-size: 15px; color: rgba(52,40,29,.76); }
    .collage { margin-top: 18px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 10px; }
    .photo, .note {
      overflow: hidden;
      border-radius: 22px;
      min-height: 220px;
      box-shadow: 0 18px 32px rgba(104, 72, 45, .14);
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .note {
      padding: 16px;
      background: linear-gradient(180deg, #fffdfa 0%, #fff0dd 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .note strong { font-size: 20px; line-height: 1.1; }
    .note span { line-height: 1.8; font-size: 14px; color: rgba(52,40,29,.72); }
    .quote { font-size: 42px; line-height: .88; margin: 0 0 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tags span { padding: 8px 10px; border-radius: 999px; background: rgba(84, 56, 26, .08); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><span class="chip">Youth Editorial / 平台介绍型</span><a class="link" href="./index.html">V2 目录</a></div>
    <section class="hero">
      <h1>Meet people<br>through moments.</h1>
      <p>这套模板不强调“功能冲击”，而是强调世界观、连接感和内容气质。适合平台介绍、品牌故事、社区氛围页。</p>
      <div class="collage">
        <div class="photo"><img src="../assets/square-screen.png" alt="广场截图"></div>
        <div class="note"><strong>不是硬社交，<br>而是一起去玩。</strong><span>信息像杂志栏目一样被组织，页面更像一篇生活方式专题，而不是官网说明书。</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="quote">让平台看起来像一种<br>可以被认同的生活方式。</div>
      <p>它要比“产品介绍页”更柔软，比“长图海报”更完整。可以容纳实拍、截图、拼贴、引导句，但不应该把所有信息压成一套规整卡片。</p>
      <div class="tags"><span>拼贴</span><span>留白</span><span>温暖实拍</span><span>内容感</span></div>
    </section>
  </main>
</body>
</html>
