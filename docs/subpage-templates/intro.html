<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台介绍型模板</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="variant-intro">
  <div class="page">
    <div class="top-note">
      <div class="shell">
        <div class="topbar">
          <div class="brand">
            <div class="brand-mark">🌈</div>
            <div class="brand-copy">
              <strong>平台介绍型</strong>
              <span>Brand Intro Template</span>
            </div>
          </div>
          <a class="pill pill-soft" href="./index.html">返回模板库</a>
        </div>
      </div>
    </div>
    <main class="shell">
      <section class="hero">
        <div class="hero-kicker">Why Meetu</div>
        <h1>不是硬社交，<br>而是一起去玩。</h1>
        <p>平台介绍页的重点不是“列功能”，而是用一句核心价值把用户带进来，再用模块解释产品到底解决了什么问题。</p>
      </section>
      <section class="panel">
        <div class="quote">先有想去的局，<br>再有想认识的人。</div>
        <p class="section-copy">这类页面适合先打一条价值金句，再接 2 到 3 组功能价值卡，而不是上来就解释产品定义。</p>
      </section>
      <section class="panel">
        <h2 class="section-title">平台价值拆成 3 组就够</h2>
        <div class="chip-row">
          <div class="chip">找到适合你的活动</div>
          <div class="chip">和同频的人一起出发</div>
          <div class="chip">活动过程有平台承接</div>
          <div class="chip">记录和评价会留下来</div>
        </div>
        <div class="mascot-bubble"><div class="mascot">✨</div><p>平台介绍页尤其需要品牌人格，否则很容易退化成“产品说明 PDF 的网页版本”。</p></div>
      </section>
      <section class="panel">
        <h2 class="section-title">截图负责告诉用户：这不是概念。</h2>
        <div class="mock-shot"><img src="../assets/square-screen.png" alt="Meetu 广场截图"></div>
      </section>
    </main>
  </div>
</body>
</html>
